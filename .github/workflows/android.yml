# App del mando de JDCStudioTape para Android, compilada en los Ubuntu de GitHub (APK firmada con la clave de depuración,
# instalable a mano). Abre Actions › «Android (JD Controller)» › Run workflow y descarga el artefacto JDController-apk.
name: Android (JD Controller)
on:
  workflow_dispatch:
  push:
    paths: [ 'android/**', 'shared/**', '.github/workflows/android.yml' ]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar platform y build-tools 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Compilar la APK (firma de depuración)
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JDController-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
